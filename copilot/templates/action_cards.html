<!-- Template 1: Action Card de Transferência Internacional ou IBAN -->
<div class="copilot-action-card">
    <div class="action-card-header">
        <span class="action-badge"><svg><use href="#i-spark"/></svg> Operação Pronta</span>
        <span class="country-pill">Portugal 🇵🇹</span>
    </div>
    <div class="action-summary-grid">
        <div class="action-grid-row">
            <span class="act-label">Beneficiário</span>
            <strong class="act-val">Maria Santos</strong>
        </div>
        <div class="action-grid-row">
            <span class="act-label">IBAN de Destino</span>
            <span class="act-val mono">PT50003506410001234567890</span>
        </div>
        <div class="action-grid-row">
            <span class="act-label">Quantia</span>
            <span class="act-val">50.000,00 Kz</span>
        </div>
        <div class="action-grid-row">
            <span class="act-label">Taxa (2.5%)</span>
            <span class="act-val text-warning">1.250,00 Kz</span>
        </div>
        <div class="action-grid-row highlight-net">
            <span class="act-label">Quanto vai (Líquido)</span>
            <strong class="act-val text-success">48.750,00 Kz</strong>
        </div>
    </div>
    <div class="action-card-btn-wrap">
        <button type="button" class="btn btn-sm btn-action-confirm">
            <span>Revisar no Painel & Confirmar</span>
            <svg><use href="#i-arrow-right"/></svg>
        </button>
    </div>
</div>

<!-- Template 2: Action Card de Registo de Despesa -->
<div class="copilot-action-card">
    <div class="action-card-header">
        <span class="action-badge"><svg><use href="#i-pie"/></svg> Despesa Registada</span>
        <span class="country-pill">Transporte</span>
    </div>
    <div class="action-summary-grid">
        <div class="action-grid-row">
            <span class="act-label">Estabelecimento/Nome</span>
            <strong class="act-val">Pumangol Luanda</strong>
        </div>
        <div class="action-grid-row">
            <span class="act-label">Valor do Gasto</span>
            <strong class="act-val debit" style="color:#FB7185;">−15.000,00 Kz</strong>
        </div>
    </div>
    <div class="action-card-btn-wrap">
        <button type="button" class="btn btn-sm btn-outline" style="width:100%;margin-top:6px;">
            <span>Ver Gráfico Donut de Despesas →</span>
        </button>
    </div>
</div>
