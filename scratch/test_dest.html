<!DOCTYPE html><html><body><script>
try {
    const ac = new AudioContext();
    const dest = ac.createMediaStreamDestination();
    dest.connect(ac.destination);
    console.error('DEST CONNECT WORKED');
} catch(e) {
    console.error('DEST CONNECT FAILED: ' + e.name + ' - ' + e.message);
} finally {
    window.close();
}
</script></body></html>
