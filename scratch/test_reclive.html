<!DOCTYPE html><html><body><canvas id="c" width="320" height="240"></canvas><script>
(async () => {
    try {
        const cv = document.getElementById('c');
        const ctx = cv.getContext('2d');
        const ac = new AudioContext();
        await ac.resume();

        const dest = ac.createMediaStreamDestination();
        const audioBus = ac.createGain();
        audioBus.gain.value = 1.0;
        audioBus.connect(dest);
        audioBus.connect(ac.destination);

        const osc = ac.createOscillator();
        osc.frequency.value = 440;
        osc.connect(audioBus);
        osc.start();

        const stream = new MediaStream([
            ...cv.captureStream(30).getVideoTracks(),
            ...dest.stream.getAudioTracks()
        ]);

        let mime = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';

        const rec = new MediaRecorder(stream, { mimeType: mime });
        const chunks = [];
        rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };

        rec.onstop = async () => {
            const blob = new Blob(chunks, { type: mime });
            const buf = await blob.arrayBuffer();
            const bytes = new Uint8Array(buf);
            let hasMp4a = false;
            for (let i = 0; i < bytes.length - 4; i++) {
                if (bytes[i] === 109 && bytes[i+1] === 112 && bytes[i+2] === 52 && bytes[i+3] === 97) hasMp4a = true;
            }
            console.error('RECLIVE_SUCCESS: mime=' + mime + ' size=' + blob.size + ' hasMp4a=' + hasMp4a);
            window.close();
        };

        rec.start(100);
        let count = 0;
        const timer = setInterval(() => {
            ctx.fillStyle = (count++ % 2 === 0) ? '#ff0000' : '#00ff00';
            ctx.fillRect(0, 0, 320, 240);
            if (count > 20) {
                clearInterval(timer);
                rec.stop();
            }
        }, 33);
    } catch(e) {
        console.error('RECLIVE_FAIL: ' + e.message);
        window.close();
    }
})();
</script></body></html>
