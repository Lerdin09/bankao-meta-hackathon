<!-- ============ COPILOT ============ -->
<section class="view copilot-view" id="view-copilot">
    <aside class="copilot-sidebar" id="copilotSidebar">
        <div class="copilot-header">
            <div class="copilot-title">
                <span class="copilot-orb"><svg><use href="#i-spark"/></svg></span>
                <div>
                    <h3>BankAO Copilot</h3>
                    <span class="copilot-subtitle">Meta Muse Spark</span>
                </div>
            </div>
            <span class="online-indicator">Online</span>
        </div>

        <div class="copilot-chat-messages" id="copilotChatMessages">
            <div class="chat-bubble ai">
                <div class="bubble-avatar"><svg><use href="#i-spark"/></svg></div>
                <div class="bubble-content">
                    <p>Olá! Sou o <strong>BankAO Copilot</strong>, o seu assistente financeiro.</p>
                    <p>Posso explicar taxas de câmbio para a Europa, simular envios e esclarecer dúvidas sobre depósitos com Multicaixa Express.</p>
                </div>
            </div>
        </div>

        <div class="copilot-quick-prompts">
            <button class="quick-prompt-btn" data-prompt="Como faço para depositar com Multicaixa Express?">Como depositar?</button>
            <button class="quick-prompt-btn" data-prompt="Quais são as taxas de câmbio para enviar dinheiro a Portugal?">Taxas para Portugal</button>
            <button class="quick-prompt-btn" data-prompt="Como funciona a garantia de livro-razão e segurança?">Segurança e ledger</button>
        </div>

        <form class="copilot-input-form" id="copilotInputForm">
            <input type="text" id="copilotUserInput" placeholder="Pergunte ao Copilot…" autocomplete="off">
            <button type="submit" class="btn-send-copilot" aria-label="Enviar"><svg><use href="#i-send"/></svg></button>
        </form>
    </aside>
</section>
