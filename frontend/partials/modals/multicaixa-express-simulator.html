<!-- Modal: simulador Multicaixa Express -->
<div class="modal-overlay" id="modalExpressSim">
    <div class="phone-simulator">
        <button type="button" class="confirm-close-btn mcx-sim-close" id="btnCloseExpressSimX" aria-label="Fechar">
            <svg><use href="#i-x"/></svg>
        </button>
        <div class="phone-notch"></div>
        <div class="phone-screen">
            <div class="phone-header">
                <span class="phone-time">12:30</span>
                <span class="phone-icons">5G ▮▮▮</span>
            </div>
            <div class="express-app-header">
                <div class="express-logo">MULTICAIXA <span>Express</span></div>
                <div class="express-sub">Autorização de pagamento</div>
            </div>
            <div class="express-body">
                <div class="express-card-art">
                    <span class="bank-name">BANCO DE ANGOLA</span>
                    <span class="card-num">•••• •••• •••• 8412</span>
                </div>
                <div class="express-tx-info">
                    <span class="tx-merchant">Comerciante: <strong>BankAO Soluções Digitais</strong></span>
                    <span class="tx-ref" id="expressSimRef">Ref: MCX-918237</span>
                    <div class="tx-price-tag" id="expressSimAmount">50.000,00 Kz</div>
                </div>
                <div class="express-pin-mock">
                    <span>Introduza o PIN ou confirme a biometria</span>
                    <div class="pin-dots">● ● ● ●</div>
                </div>
                <div class="express-actions">
                    <button class="btn-mcx-reject" id="btnMcxReject">Recusar</button>
                    <button class="btn-mcx-approve" id="btnMcxApprove">Aprovar</button>
                </div>
            </div>
        </div>
    </div>
</div>
