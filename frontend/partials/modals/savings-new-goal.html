<!-- ============ MODAL: NOVA META DE POUPANÇA ============ -->
<div class="modal-overlay" id="modalNewGoal" style="display:none">
    <div class="confirm-transfer-modal form-modal" style="max-width:540px;">
        <div class="confirm-modal-header">
            <div class="confirm-modal-icon" style="background:linear-gradient(135deg,rgba(56,189,248,0.2),rgba(99,102,241,0.2));color:#38BDF8;">
                <svg><use href="#i-target"/></svg>
            </div>
            <div class="confirm-header-text">
                <h3>Criar Nova Meta de Poupança</h3>
                <p class="confirm-subtitle">Defina o seu objetivo e poupe com juro anual garantido de 4,5%</p>
            </div>
            <button type="button" class="confirm-close-btn" onclick="closeNewGoalModal()" aria-label="Fechar">
                <svg><use href="#i-x"/></svg>
            </button>
        </div>

        <form id="formNewGoal" onsubmit="handleCreateGoal(event)">
            <div class="confirm-modal-body">
                <div class="form-row">
                    <label class="form-label" for="goalName">Nome do Objetivo</label>
                    <input type="text" class="input" id="goalName" placeholder="Ex: Viagem de Férias, Carro Novo, Casa Própria" required autocomplete="off">
                </div>

                <div class="form-row">
                    <label class="form-label">Ícone do Objetivo</label>
                    <div class="goal-icon-grid-rich" id="goalIconPicker">
                        <button type="button" class="goal-ico-rich-btn active" data-icon="travel">
                            <div class="ico-box"><svg><use href="#i-plane"/></svg></div>
                            <span class="lbl">Viagem</span>
                        </button>
                        <button type="button" class="goal-ico-rich-btn" data-icon="home">
                            <div class="ico-box"><svg><use href="#i-home"/></svg></div>
                            <span class="lbl">Habitação</span>
                        </button>
                        <button type="button" class="goal-ico-rich-btn" data-icon="car">
                            <div class="ico-box"><svg><use href="#i-car"/></svg></div>
                            <span class="lbl">Automóvel</span>
                        </button>
                        <button type="button" class="goal-ico-rich-btn" data-icon="laptop">
                            <div class="ico-box"><svg><use href="#i-laptop"/></svg></div>
                            <span class="lbl">Tecnologia</span>
                        </button>
                        <button type="button" class="goal-ico-rich-btn" data-icon="education">
                            <div class="ico-box"><svg><use href="#i-book"/></svg></div>
                            <span class="lbl">Educação</span>
                        </button>
                        <button type="button" class="goal-ico-rich-btn" data-icon="target">
                            <div class="ico-box"><svg><use href="#i-target"/></svg></div>
                            <span class="lbl">Objetivo</span>
                        </button>
                        <button type="button" class="goal-ico-rich-btn" data-icon="shield">
                            <div class="ico-box"><svg><use href="#i-shield"/></svg></div>
                            <span class="lbl">Reserva</span>
                        </button>
                        <button type="button" class="goal-ico-rich-btn" data-icon="award">
                            <div class="ico-box"><svg><use href="#i-award"/></svg></div>
                            <span class="lbl">Conquista</span>
                        </button>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-row">
                        <label class="form-label" for="goalTarget">Valor da Meta (KZ)</label>
                        <div class="input-affix">
                            <input type="text" inputmode="numeric" class="input js-money" id="goalTarget" placeholder="Ex: 250.000" required oninput="calculateSavingsSimulation()">
                            <span>KZ</span>
                        </div>
                        <div class="form-quick-chips">
                            <button type="button" class="chip-btn" onclick="setGoalFieldValue('goalTarget', 100000)">100K</button>
                            <button type="button" class="chip-btn" onclick="setGoalFieldValue('goalTarget', 250000)">250K</button>
                            <button type="button" class="chip-btn" onclick="setGoalFieldValue('goalTarget', 500000)">500K</button>
                            <button type="button" class="chip-btn" onclick="setGoalFieldValue('goalTarget', 1000000)">1M</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="form-label" for="goalMonthly">Depósito Mensal (KZ)</label>
                        <div class="input-affix">
                            <input type="text" inputmode="numeric" class="input js-money" id="goalMonthly" placeholder="Ex: 25.000" required oninput="calculateSavingsSimulation()">
                            <span>KZ</span>
                        </div>
                        <div class="form-quick-chips">
                            <button type="button" class="chip-btn" onclick="setGoalFieldValue('goalMonthly', 10000)">10K</button>
                            <button type="button" class="chip-btn" onclick="setGoalFieldValue('goalMonthly', 25000)">25K</button>
                            <button type="button" class="chip-btn" onclick="setGoalFieldValue('goalMonthly', 50000)">50K</button>
                        </div>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-row">
                        <label class="form-label" for="goalInitial">Saldo Inicial (sai da conta)</label>
                        <div class="input-affix">
                            <input type="text" inputmode="numeric" class="input js-money" id="goalInitial" placeholder="0" value="0" oninput="calculateSavingsSimulation()">
                            <span>KZ</span>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="form-label" for="goalDeadline">Prazo Estimado</label>
                        <input type="month" class="input" id="goalDeadline" required onchange="calculateSavingsSimulation()">
                    </div>
                </div>


                <div class="form-grid-2">
                    <div class="form-row">
                        <label class="form-label" for="goalDebitDay">Débito automático mensal</label>
                        <select class="input" id="goalDebitDay" onchange="syncGoalSchedule('goal')">
                            <option value="">Sem débito automático</option><option value="1">Dia 1</option><option value="2">Dia 2</option><option value="3">Dia 3</option><option value="4">Dia 4</option><option value="5">Dia 5</option><option value="6">Dia 6</option><option value="7">Dia 7</option><option value="8">Dia 8</option><option value="9">Dia 9</option><option value="10">Dia 10</option><option value="11">Dia 11</option><option value="12">Dia 12</option><option value="13">Dia 13</option><option value="14">Dia 14</option><option value="15">Dia 15</option><option value="16">Dia 16</option><option value="17">Dia 17</option><option value="18">Dia 18</option><option value="19">Dia 19</option><option value="20">Dia 20</option><option value="21">Dia 21</option><option value="22">Dia 22</option><option value="23">Dia 23</option><option value="24">Dia 24</option><option value="25">Dia 25</option><option value="26">Dia 26</option><option value="27">Dia 27</option><option value="28">Dia 28</option><option value="29">Dia 29</option><option value="30">Dia 30</option><option value="31">Dia 31</option>
                        </select>
                    </div>
                    <div class="form-row" id="goalStartRow" hidden>
                        <label class="form-label" for="goalStart">Começa em</label>
                        <input type="month" class="input" id="goalStart" onchange="syncGoalSchedule('goal', true)">
                    </div>
                </div>
                <p class="dep-hint" id="goalAutoHint" hidden></p>

                <!-- Simulador inteligente com cálculo dinâmico -->
                <div class="savings-smart-simulator">
                    <div class="sim-header">
                        <div class="sim-header-title">
                            <svg><use href="#i-spark"/></svg>
                            <span>Simulação Inteligente BankAO</span>
                        </div>
                        <span class="sim-rate-badge">4,5% ao ano</span>
                    </div>
                    <div class="sim-metrics-grid">
                        <div class="sim-metric">
                            <span class="sim-metric-lbl">Tempo estimado</span>
                            <strong class="sim-metric-val" id="newGoalSimMonths">10 meses</strong>
                        </div>
                        <div class="sim-metric">
                            <span class="sim-metric-lbl">Juros estimados</span>
                            <strong class="sim-metric-val green" id="newGoalSimInterest">+9.375 KZ</strong>
                        </div>
                    </div>
                    <p class="sim-advice-text" id="newGoalSimAdvice">
                        Com base nas contribuições indicadas, atingirá o seu objetivo antes da data limite!
                    </p>
                </div>
            </div>

            <div class="confirm-modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeNewGoalModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary">
                    <span>Criar meta</span>
                    <svg><use href="#i-check"/></svg>
                </button>
            </div>
        </form>
    </div>
</div>
