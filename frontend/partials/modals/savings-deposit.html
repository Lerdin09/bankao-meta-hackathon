<!-- ============ MODAL: DEPOSITAR NUMA META DE POUPANÇA ============ -->
<div class="modal-overlay" id="modalDepositGoal" style="display:none">
    <div class="confirm-transfer-modal form-modal" role="dialog" aria-modal="true" aria-labelledby="depTitle">
        <div class="confirm-modal-header">
            <div class="confirm-modal-icon" style="background:linear-gradient(135deg,rgba(74,222,128,0.2),rgba(56,189,248,0.2));color:#4ADE80;">
                <svg><use href="#i-down"/></svg>
            </div>
            <div class="confirm-header-text">
                <h3 id="depTitle">Depositar na Poupança</h3>
                <p class="confirm-subtitle">Sai já da sua conta e vai para a meta</p>
            </div>
            <button type="button" class="confirm-close-btn" onclick="closeDepositGoalModal()" aria-label="Fechar">
                <svg><use href="#i-x"/></svg>
            </button>
        </div>

        <form id="formDepositGoal" onsubmit="handleDepositGoal(event)">
            <input type="hidden" id="depGoalId">
            <div class="confirm-modal-body">
                <!-- Conta de Débito (Origem) -->
                <div class="dep-account-source-card">
                    <div class="dep-acc-left">
                        <div class="dep-acc-icon"><svg><use href="#i-wallet"/></svg></div>
                        <div class="dep-acc-meta">
                            <strong>Conta Principal AOA</strong>
                            <span>Débito imediato sem comissões</span>
                        </div>
                    </div>
                    <div class="dep-acc-balance-badge">
                        <span>Saldo disponível</span>
                        <strong id="depSourceAccountBalance">1.250.000 KZ</strong>
                    </div>
                </div>

                <div class="dep-goal-summary">
                    <div class="sav-goal-icon" id="depGoalIcon"><svg><use href="#i-target"/></svg></div>
                    <div>
                        <strong id="depGoalName">Meta</strong>
                        <span id="depGoalProgress"></span>
                    </div>
                </div>

                <div class="confirm-details-card">
                    <div class="confirm-row">
                        <span class="c-label">Falta para atingir a meta</span>
                        <strong class="c-val" id="depGoalRemaining">—</strong>
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label" for="depAmount">Valor a depositar (KZ)</label>
                    <div class="input-affix">
                        <input type="text" inputmode="numeric" class="input js-money" id="depAmount" placeholder="Ex: 10.000" required autocomplete="off" aria-describedby="depError">
                        <span>KZ</span>
                    </div>
                    <div class="form-quick-chips">
                        <button type="button" class="chip-btn green" onclick="setDepositQuickAmount(5000)">+5K</button>
                        <button type="button" class="chip-btn green" onclick="setDepositQuickAmount(10000)">+10K</button>
                        <button type="button" class="chip-btn green" onclick="setDepositQuickAmount(25000)">+25K</button>
                        <button type="button" class="chip-btn green" onclick="setDepositQuickAmount(50000)">+50K</button>
                        <button type="button" class="chip-btn" id="depFillRemainingChip" onclick="fillDepositRemaining()">Completar meta</button>
                    </div>
                    <p class="dep-error" id="depError" role="alert" hidden></p>
                </div>

                <details class="dep-more">
                    <summary>Data e nota (opcional)</summary>
                    <div class="form-grid-2">
                        <div class="form-row">
                            <label class="form-label" for="depDate">Data</label>
                            <input type="date" class="input" id="depDate" required>
                        </div>
                        <div class="form-row">
                            <label class="form-label" for="depNotes">Nota</label>
                            <input type="text" class="input" id="depNotes" placeholder="Ex: Bónus, 13.º mês" maxlength="120">
                        </div>
                    </div>
                </details>

                <p class="dep-hint">O valor <strong>sai da conta principal</strong> e fica registado em <strong>Despesas</strong> (Poupança).</p>
            </div>

            <div class="confirm-modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeDepositGoalModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="btnDepSubmit" disabled>
                    <span>Depositar</span>
                    <svg><use href="#i-check"/></svg>
                </button>
            </div>
        </form>
    </div>
</div>
